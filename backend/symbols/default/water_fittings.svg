<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.0 0.0 52.0 59.0" width="64" height="64">
  <!-- Top pipe stub (upstream supply connection) -->
  <line x1="32" y1="0" x2="32" y2="10" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Top horizontal bar -->
  <line x1="14" y1="10" x2="50" y2="10" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Upper triangle: two lines converging to centre point -->
  <line x1="14" y1="10" x2="32" y2="31" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="10" x2="32" y2="31" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower triangle: two lines diverging from centre point -->
  <line x1="32" y1="31" x2="14" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="31" x2="50" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom horizontal bar -->
  <line x1="14" y1="50" x2="50" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Short vertical stem -->
  <line x1="32" y1="50" x2="32" y2="57" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Horizontal base bar -->
  <line x1="8" y1="57" x2="56" y2="57" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
