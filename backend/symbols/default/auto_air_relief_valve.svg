<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Supply stub from bottom -->
  <line x1="32" y1="64" x2="32" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Stem up to triangle base -->
  <line x1="32" y1="50" x2="32" y2="42" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Upward-pointing triangle (air venting upward) -->
  <polygon points="32,10 16,42 48,42" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Air vent lines at top of triangle -->
  <line x1="26" y1="6" x2="38" y2="6" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="10" x2="40" y2="10" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
