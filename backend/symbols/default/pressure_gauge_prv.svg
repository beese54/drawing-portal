<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Connection stubs -->
  <line x1="0" y1="32" x2="12" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="64" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- PRV asymmetric triangles (compact, leaving room for gauge above) -->
  <polygon points="12,20 12,48 32,34" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <polygon points="52,24 52,44 32,34" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <line x1="32" y1="20" x2="32" y2="48" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gauge stem -->
  <line x1="32" y1="14" x2="32" y2="20" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Pressure gauge circle -->
  <circle cx="32" cy="8" r="7" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="32" y="11" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#1a1a1a">P</text>
