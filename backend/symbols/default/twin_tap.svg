<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Supply stub from top -->
  <line x1="32" y1="0" x2="32" y2="14" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Branch line to two taps -->
  <line x1="20" y1="14" x2="44" y2="14" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Left tap vertical body -->
  <line x1="20" y1="14" x2="20" y2="36" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Left tap handle -->
  <line x1="10" y1="28" x2="30" y2="28" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="23" x2="10" y2="33" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="23" x2="30" y2="33" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right tap vertical body -->
  <line x1="44" y1="14" x2="44" y2="36" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right tap handle -->
  <line x1="34" y1="28" x2="54" y2="28" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="23" x2="34" y2="33" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="23" x2="54" y2="33" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
