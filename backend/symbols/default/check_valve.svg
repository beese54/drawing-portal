<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.0 12.0 64.0 40.0" width="64" height="64">
  <!-- Connection stubs -->
  <line x1="0" y1="32" x2="12" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="64" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- White fill for occlusion -->
  <polygon points="12,14 12,50 32,32" fill="white" stroke="none"/>
  <polygon points="52,14 52,50 32,32" fill="white" stroke="none"/>
  <!-- Left triangle: all 3 sides (full) -->
  <line x1="12" y1="14" x2="12" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="14" x2="32" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="32" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right triangle: top diagonal + right base only (bottom diagonal removed) -->
  <line x1="32" y1="32" x2="52" y2="14" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="14" x2="52" y2="50" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
