<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sensor body rectangle -->
  <rect x="14" y="6" width="36" height="18" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- LS label -->
  <text x="32" y="17" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a">LS</text>
  <!-- Horizontal bar connecting probes -->
  <line x1="18" y1="32" x2="46" y2="32" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cable from sensor to bar -->
  <line x1="32" y1="24" x2="32" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Three hanging probes -->
  <line x1="22" y1="32" x2="22" y2="56" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="32" y2="50" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="32" x2="42" y2="56" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Probe tips -->
  <circle cx="22" cy="57" r="2" fill="#1a1a1a"/>
  <circle cx="32" cy="51" r="2" fill="#1a1a1a"/>
  <circle cx="42" cy="57" r="2" fill="#1a1a1a"/>
</svg>
