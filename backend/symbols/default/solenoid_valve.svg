<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Connection stubs at centre height -->
  <line x1="0" y1="32" x2="12" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="64" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Valve triangles centred at y=32 -->
  <polygon points="12,20 12,44 32,32" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <polygon points="52,20 52,44 32,32" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <line x1="32" y1="20" x2="32" y2="44" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Actuator stem -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- S box -->
  <rect x="22" y="2" width="20" height="16" rx="2" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="32" y="12" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">S</text>
</svg>
