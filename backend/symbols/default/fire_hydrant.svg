<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Main horizontal pipe -->
  <line x1="0" y1="56" x2="64" y2="56" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Vertical riser from pipe -->
  <line x1="32" y1="56" x2="32" y2="44" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Barrel (main body rectangle) -->
  <rect x="20" y="28" width="24" height="16" stroke="#1a1a1a" stroke-width="2" fill="white" rx="2"/>
  <!-- Domed top cap -->
  <path d="M 22,28 Q 32,16 42,28" stroke="#1a1a1a" stroke-width="2" fill="white"/>
  <!-- Left outlet nozzle -->
  <line x1="14" y1="36" x2="20" y2="36" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right outlet nozzle -->
  <line x1="44" y1="36" x2="50" y2="36" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
