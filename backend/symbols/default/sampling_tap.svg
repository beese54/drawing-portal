<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Left stub (upstream) at y=32 -->
  <line x1="0" y1="32" x2="14" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right stub (downstream) at y=32 -->
  <line x1="50" y1="32" x2="64" y2="32" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom stub (sample port) at x=32 -->
  <line x1="32" y1="50" x2="32" y2="64" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Inline gate valve body centred at y=32 -->
  <polygon points="14,18 14,46 32,32" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <polygon points="50,18 50,46 32,32" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <line x1="32" y1="18" x2="32" y2="50" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tap cross at bottom of sample branch -->
  <line x1="22" y1="58" x2="42" y2="58" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="54" x2="22" y2="62" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="54" x2="42" y2="62" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
