<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ground line (dashed) -->
  <line x1="2" y1="58" x2="62" y2="58" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Chamber body -->
  <rect x="14" y="10" width="36" height="48" stroke="#1a1a1a" stroke-width="2" fill="white"/>
  <!-- Inlet pipe from left -->
  <line x1="0" y1="24" x2="14" y2="24" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Outlet pipe to right -->
  <line x1="50" y1="44" x2="64" y2="44" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Internal hatch lines (earth fill indication) -->
  <line x1="14" y1="58" x2="22" y2="48" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="58" x2="32" y2="48" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
  <line x1="34" y1="58" x2="42" y2="48" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
  <line x1="44" y1="58" x2="50" y2="52" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
</svg>
