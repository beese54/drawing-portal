<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Supply stub from top -->
  <line x1="32" y1="0" x2="32" y2="12" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Vertical body to valve -->
  <line x1="32" y1="12" x2="32" y2="24" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Valve body (horizontal gate valve, compact) -->
  <polygon points="20,24 20,40 32,32" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <polygon points="44,24 44,40 32,32" stroke="#1a1a1a" stroke-width="2" fill="white" stroke-linejoin="round"/>
  <line x1="32" y1="24" x2="32" y2="40" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arm to float ball -->
  <line x1="44" y1="32" x2="52" y2="44" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Float ball -->
  <circle cx="52" cy="50" r="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
