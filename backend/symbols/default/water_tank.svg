<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="tankClip">
      <rect x="10" y="8" width="44" height="48" rx="2"/>
    </clipPath>
  </defs>
  <!-- Water fill (bottom ~55%) -->
  <rect x="10" y="34" width="44" height="22" fill="#cce5ff" clip-path="url(#tankClip)"/>
  <!-- Tank outline -->
  <rect x="10" y="8" width="44" height="48" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Water level dashed line -->
  <line x1="10" y1="34" x2="54" y2="34" stroke="#007bff" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
