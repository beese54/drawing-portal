<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <defs>
    <clipPath id="tankClip">
      <rect x="2" y="2" width="60" height="60" rx="3"/>
    </clipPath>
  </defs>
  <!-- Water fill (~45% from bottom) -->
  <rect x="2" y="35" width="60" height="27" fill="#cce5ff" clip-path="url(#tankClip)"/>
  <!-- Tank outline — body fills y=2..62, leaving 2px each side for stroke not to clip -->
  <rect x="2" y="2" width="60" height="60" rx="3" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Water level dashed line -->
  <line x1="2" y1="35" x2="62" y2="35" stroke="#007bff" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
