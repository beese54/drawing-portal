# ─────────────────────────────────────────────────────────────────────────────
# Schematic Drawing Portal — GitLab CI/CD
#
# Mirrors .github/workflows/docker-publish.yml (build the combined image, tag it,
# push it) and adds the step that workflow does not have: the tests run BEFORE
# anything is published, so a red suite cannot become a :latest tag.
#
# Pipeline shape:
#   test    → backend pytest, frontend typecheck + build + import-validation harness
#   build   → one image, pushed to the GitLab Container Registry
#   scan    → Trivy against the image just built  (opt-in; closes audit finding F6)
#   dast    → GitLab DAST against a throwaway copy of the GovPaaS image (opt-in)
#   publish → mirror the same digest to GHCR      (opt-in; GovPaaS pulls from GHCR)
#   deploy  → trigger a GovPaaS rollout           (opt-in, manual)
#
# ── What you must set in GitLab ─────────────────────────────────────────────
# Nothing, for the default path: the $CI_REGISTRY_* variables are injected
# automatically and the image lands in this project's own Container Registry.
#
# Settings → CI/CD → Variables, only for the opt-in jobs:
#   ENABLE_BUILD         "true" to run the build stage at all. OFF BY DEFAULT:
#                        this instance's runners cannot build container images
#                        — uid 65533, CapEff 0000000000000000 (probed 2026-09-11),
#                        which blocks docker:dind (needs privileged) and kaniko
#                        (needs root) alike. The probe's "touch /" failed with
#                        "Permission denied", not "Read-only file system", so /
#                        is non-root-owned rather than proven read-only.
#                        No .gitlab-ci.yml change can lift that; it is a runner
#                        config.toml decision for a GitLab admin. Until then the
#                        image is built by GitHub Actions and published to GHCR,
#                        and this pipeline's job is the test stage. Flip this to
#                        "true" the day privileges are granted — no commit needed.
#   BUILD_ENGINE         "docker" (default) or "kaniko" — see the build jobs
#   ENABLE_SCAN          "true" to run the Trivy job
#   ENABLE_DAST          "true" to run the DAST job (needs GitLab Ultimate)
#   DAST_APP_IMAGE       image DAST scans; defaults to the GHCR :latest below
#   GHCR_USER           GitHub username, if mirroring to GHCR
#   GHCR_TOKEN           classic PAT with write:packages   (masked, protected)
#   GOVPAAS_API_TOKEN    GovPaaS/Northflank API token      (masked, protected)
#   GOVPAAS_RESTART_URL  the service's restart endpoint — see deploy:govpaas
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - test
  - build
  - scan
  - dast
  - publish
  - deploy

include:
  # GitLab's own DAST job. The `dast` job below overrides the parts that matter
  # here; everything else (analyzer image, report artifact) comes from this.
  - template: Security/DAST.gitlab-ci.yml

variables:
  # "docker" uses docker:dind and needs a PRIVILEGED runner. If your company's
  # runners refuse privileged containers — common on locked-down installs — set
  # this to "kaniko" in the CI/CD variables and the other build job takes over.
  # Nothing else changes; both produce the same image from the same Dockerfile.
  BUILD_ENGINE: "docker"

  IMAGE: "$CI_REGISTRY_IMAGE"
  DOCKER_TLS_CERTDIR: "/certs"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  # Full history is never needed here; a shallow clone is markedly faster.
  GIT_DEPTH: "20"

  # What the dast job scans: the image GovPaaS pulls. :latest rather than this
  # commit's tag because GitHub's short-sha tags are 7 characters and
  # $CI_COMMIT_SHORT_SHA is 8, and CI variables cannot slice a string. To pin a
  # build, set this in the CI/CD variables to e.g. ghcr.io/beese54/drawing-portal:sha-79475a5
  DAST_APP_IMAGE: "ghcr.io/beese54/drawing-portal:latest"

default:
  # A newer commit on the same branch cancels this run rather than racing it.
  interruptible: true

# ── Tag computation, shared by both build jobs ───────────────────────────────
# Same tagging rules as the GitHub workflow's metadata-action:
#   every build      → :<short sha>     (the immutable one — pin to this)
#   default branch   → :latest
#   git tag vX.Y.Z   → :X.Y.Z
.compute_tags: &compute_tags |
  export TAGS="$CI_COMMIT_SHORT_SHA"
  if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then TAGS="$TAGS latest"; fi
  if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS ${CI_COMMIT_TAG#v}"; fi
  echo "Tagging $IMAGE with: $TAGS"

# ──────────────────────────────────────────────────────────────── test stage ──

backend:test:
  stage: test
  image: python:3.12-slim
  cache:
    key:
      files:
        - backend/requirements-dev.txt
    paths:
      - .cache/pip
  script:
    - pip install --quiet --root-user-action=ignore -r backend/requirements-dev.txt
    - cd backend
    # JUnit output so failures surface on the merge request itself, not just the log.
    - python -m pytest -q --junitxml="$CI_PROJECT_DIR/report-backend.xml"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report-backend.xml

frontend:check:
  stage: test
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --fund=false
    # tsc first: it fails faster and more legibly than the bundler does.
    - npx tsc --noEmit
    - npm run build
    # The import boundary's own harness. It compiles importValidation.ts with the
    # esbuild already in node_modules, so it needs frontend/node_modules present —
    # which is why it runs here rather than in a job of its own.
    - node ../tasks/repro/import_validation.repro.mjs
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - frontend/dist

# ─────────────────────────────────────────────────────────────── build stage ──
# Exactly one of these runs, chosen by $BUILD_ENGINE.

build:image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    # On a Kubernetes executor the dind service is a SEPARATE container in the
    # pod, so there is no shared /var/run/docker.sock and the CLI must reach it
    # over TCP. Without this the job fails with "Cannot connect to the Docker
    # daemon at unix:///var/run/docker.sock" (observed 2026-09-11) no matter
    # what privileges the runner grants. Services share the pod network, so the
    # `docker` alias resolves to localhost; TLS is off because the k8s executor
    # does not share /certs between the service and build containers, and the
    # traffic never leaves the pod.
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$ENABLE_BUILD != "true"'
      when: never
    - if: '$BUILD_ENGINE == "kaniko"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - *compute_tags
    # Build context is the repo root, not backend/ — the Dockerfile's two stages
    # need both backend/ and frontend/.
    - docker pull "$IMAGE:latest" || true
    - >
      docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "$IMAGE:latest"
      $(for t in $TAGS; do printf -- '--tag %s:%s ' "$IMAGE" "$t"; done)
      .
    - for t in $TAGS; do docker push "$IMAGE:$t"; done
    # Record the digest so scan/publish/deploy act on this exact image rather than
    # re-resolving a tag that may have moved underneath them.
    - docker image inspect "$IMAGE:$CI_COMMIT_SHORT_SHA" --format '{{index .RepoDigests 0}}' > image-digest.txt
    - cat image-digest.txt
  artifacts:
    expire_in: 1 week
    paths:
      - image-digest.txt

build:image:kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    # This instance's runners refuse writes to /kaniko (job failed 2026-09-11 with
    # "can't create /kaniko/.docker/config.json: Permission denied"). Kaniko reads
    # DOCKER_CONFIG and only defaults to /kaniko/.docker, so point it at the build
    # directory, which the git checkout proves is writable.
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  rules:
    - if: '$ENABLE_BUILD != "true"'
      when: never
    - if: '$BUILD_ENGINE != "kaniko"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  script:
    # Kaniko builds in userspace — no privileged runner, no docker daemon.
    - mkdir -p "$DOCKER_CONFIG"
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$DOCKER_CONFIG/config.json"
    - *compute_tags
    # --digest-file also lands in the build dir: if /kaniko is unwritable, /tmp is
    # not a safe assumption either.
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      $(for t in $TAGS; do printf -- '--destination %s:%s ' "$IMAGE" "$t"; done)
      --cache=true
      --digest-file="$CI_PROJECT_DIR/digest"
    - echo "$IMAGE@$(cat "$CI_PROJECT_DIR/digest")" > image-digest.txt
    - cat image-digest.txt
  artifacts:
    expire_in: 1 week
    paths:
      - image-digest.txt

# ──────────────────────────────────────────────────────────────── scan stage ──
# Opt-in: set ENABLE_SCAN=true. Closes finding F6 in tasks/security_audit.md
# ("no CI dependency scanning"). allow_failure so a newly-published CVE reports
# itself without blocking a deploy — tighten to false once the backlog is triaged.

scan:image:
  stage: scan
  image:
    name: aquasec/trivy:0.55.2
    entrypoint: [""]
  rules:
    - if: '$ENABLE_SCAN == "true"'
  allow_failure: true
  script:
    - export IMAGE_REF="$(cat image-digest.txt)"
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress "$IMAGE_REF"
    - >
      trivy image --exit-code 0 --no-progress
      --format template --template "@contrib/gitlab.tpl"
      --output "$CI_PROJECT_DIR/gl-container-scanning-report.json" "$IMAGE_REF"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-container-scanning-report.json

# ──────────────────────────────────────────────────────────────── dast stage ──
# Opt-in: set ENABLE_DAST=true. Overrides the template's `dast` job.
#
# The target is NOT the live GovPaaS URL. GitLab's DAST docs say outright "Do not
# run DAST scans against a production server", and testing the live .code.run
# host is PT-category activity on shared government infrastructure that still
# needs GovPaaS's written authorisation. Instead the job starts the same image
# GovPaaS runs as a sidecar in its own pod and attacks that copy over localhost:
# full active scan, nothing leaves the runner, nothing in production is touched.
#
# Findings land in the pipeline's Security tab and the project's Vulnerability
# Report. allow_failure (inherited from the template) is deliberate for the first
# runs; enforcement belongs in a security policy once the baseline is triaged.

dast:
  stage: dast
  # Needs no artifacts from earlier jobs; without this it would download them all.
  dependencies: []
  services:
    - name: "$DAST_APP_IMAGE"
      alias: portal
  variables:
    DAST_TARGET_URL: "http://portal:8000"
    # Passive + active checks. Safe only because the target is a disposable copy.
    DAST_FULL_SCAN: "true"
    # uvicorn is up in ~2 s, but the sidecar image is pulled first (pull policy
    # Always on these runners), so allow for the pull.
    DAST_TARGET_CHECK_TIMEOUT: "180s"
    # Defaults are 24h crawl + 3h active; the runner kills a pod at 1 h. The SPA
    # is one page and five endpoints, so these bounds are generous, not tight.
    DAST_CRAWL_TIMEOUT: "10m"
    DAST_ACTIVE_SCAN_TIMEOUT: "35m"
  timeout: 55m
  # DAST starts an internal Squid proxy that writes under /run and /var/log; on a
  # read-only root filesystem it dies with "Timed out waiting for Squid port"
  # (reproduced locally 2026-10-09). This line says which case a failure is.
  before_script:
    - awk '$2 == "/" { print "rootfs mount options:", $4 }' /proc/mounts || true
  rules:
    - if: '$ENABLE_DAST != "true"'
      when: never
    # $GITLAB_FEATURES carries "dast" only on Ultimate — the same check the
    # template makes. Without Ultimate this job silently never appears.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_FEATURES =~ /\bdast\b/'

# ───────────────────────────────────────────────────────────── publish stage ──
# GovPaaS currently pulls ghcr.io/beese54/drawing-portal, NOT the GitLab registry.
# Until that is repointed, mirroring keeps GovPaaS fed from GitLab CI. The job
# skips itself when GHCR_TOKEN is unset, so it stays inert until you want it.

publish:ghcr:
  stage: publish
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    GHCR_IMAGE: "ghcr.io/beese54/drawing-portal"
  rules:
    - if: '$GHCR_TOKEN == null || $GHCR_TOKEN == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$GHCR_TOKEN" | docker login -u "$GHCR_USER" --password-stdin ghcr.io
    - *compute_tags
    - export SRC="$(cat image-digest.txt)"
    - docker pull "$SRC"
    - for t in $TAGS; do docker tag "$SRC" "$GHCR_IMAGE:$t"; docker push "$GHCR_IMAGE:$t"; done

# ────────────────────────────────────────────────────────────── deploy stage ──
# Manual on purpose. The service runs a single replica on a ReadWriteOnce volume
# with a Steady rollout, so deploys are one-at-a-time and worth a human pressing
# the button — that same constraint is why horizontal scaling is off at all.
#
# GOVPAAS_RESTART_URL: take this from the GovPaaS/Northflank API docs for YOUR
# service. It is a variable rather than a hardcoded URL precisely so that nobody
# ships an invented endpoint — do not guess it.

deploy:govpaas:
  stage: deploy
  image: curlimages/curl:8.10.1
  environment:
    name: govpaas-production
  rules:
    - if: '$GOVPAAS_API_TOKEN == null || $GOVPAAS_API_TOKEN == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true
  script:
    - test -n "$GOVPAAS_RESTART_URL" || { echo "GOVPAAS_RESTART_URL is not set"; exit 1; }
    - >
      curl --fail --show-error --silent -X POST "$GOVPAAS_RESTART_URL"
      -H "Authorization: Bearer $GOVPAAS_API_TOKEN"
      -H "Content-Type: application/json"
