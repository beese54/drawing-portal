# Local development only: `docker compose up --build`.
# Deployment uses the combined root Dockerfile, never this file.
#
# The browser talks to the Vite dev server on :5173, which proxies /api to the
# backend, so every request is same-origin and ALLOWED_ORIGINS stays unset
# (as in production). Source is bind-mounted, so edits reload without a rebuild.
# Until 1.1.3 this file also defined a split production stack (nginx frontend
# on :3000 calling the API cross-origin); that stack was retired.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/symbols:/app/symbols
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - SYMBOLS_PATH=/app/symbols
      - ENABLE_API_DOCS=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_API_BASE_URL=
      - BACKEND_URL=http://backend:8000
