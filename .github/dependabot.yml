# Dependabot version updates: one PR per update, opened weekly, so pinned
# versions and digests do not silently go stale. Every PR runs the full GitLab
# pipeline (via the pull mirror), including the deps:audit gate, so a bump is
# tested before anyone merges it. Merging is still a human decision.
#
# Major upgrades are ignored here on purpose. They are planned work with their
# own regression check (e.g. vite 5 → 8, tasks/todo.md A4), not a weekly PR.
# The runtime base image stays on Python 3.12 until that is a decision; only
# its digest (Alpine and 3.12.x security patches) moves.
#
# cooldown: a version is only proposed once it has been public for 7 days, so
# a hijacked or broken release is likely to be caught and pulled before it
# reaches a PR. It delays version updates only; Dependabot security updates
# are not held back.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # backend/requirements.txt is a pip-compile lock of requirements.in (H5).
  # Dependabot recognises the pip-compile header and updates the .in pin and
  # both hashed locks in one PR; ci/lock_check.py fails any PR where they drift.
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Keeps the SHA-pinned actions in docker-publish.yml current; Dependabot
  # updates the SHA and the "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
