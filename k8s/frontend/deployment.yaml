apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: schematic-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # imagePullSecrets:
      #   - name: ghcr-pull-secret   # only needed if the ghcr.io package is private
      containers:
        - name: frontend
          image: ghcr.io/beese54/drawing-portal-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
