apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: schematic-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # imagePullSecrets:
      #   - name: ghcr-pull-secret   # only needed if the ghcr.io package is private
      containers:
        - name: app
          image: ghcr.io/beese54/drawing-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: symbols-storage
              mountPath: /app/symbols
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: symbols-storage
          persistentVolumeClaim:
            claimName: symbols-pvc
